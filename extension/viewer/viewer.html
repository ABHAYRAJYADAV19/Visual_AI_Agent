<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visual Activity Agent — My Data</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #0e0e1e;
      --bg-secondary: #161630;
      --border: rgba(100, 100, 255, 0.1);
      --text-primary: #e8e8f0;
      --text-secondary: #9898b8;
      --text-muted: #6868a0;
      --accent-gradient: linear-gradient(135deg, #4f7cff 0%, #7c5cff 100%);
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      margin: 0;
      padding: 40px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 800px;
    }

    h1 { margin-bottom: 8px; }
    p.subtitle { color: var(--text-secondary); margin-bottom: 32px; }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      margin-bottom: 32px;
    }

    .stat-card {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      text-align: center;
    }

    .stat-value {
      font-size: 48px;
      font-weight: 700;
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    .stat-label {
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-size: 14px;
      font-weight: 600;
    }

    .table-wrapper {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th {
      background: rgba(255, 255, 255, 0.03);
      padding: 16px;
      font-size: 12px;
      text-transform: uppercase;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border);
    }

    td {
      padding: 16px;
      border-bottom: 1px solid var(--border);
      font-size: 14px;
    }

    tr:last-child td { border-bottom: none; }
    
    .badge {
      background: rgba(79, 124, 255, 0.1);
      color: #7c5cff;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }

    #loading {
      text-align: center;
      padding: 40px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Your Data</h1>
    <p class="subtitle">A summary of the privacy-first data captured during your sessions.</p>

    <div id="loading">Loading your secure data...</div>

    <div id="content" style="display: none;">
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-value" id="total-events">0</div>
          <div class="stat-label">DOM Events Captured</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="total-screenshots">0</div>
          <div class="stat-label">Screenshots Analyzed</div>
        </div>
      </div>

      <h2>Recent AI Annotations</h2>
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>Activity Type</th>
              <th>Category</th>
              <th>AI Summary (No PII)</th>
            </tr>
          </thead>
          <tbody id="table-body">
            <!-- Rows injected by JS -->
          </tbody>
        </table>
      </div>
    </div>
  </div>
  <script src="viewer.js"></script>
</body>
</html>
